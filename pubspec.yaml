name: fillup
description: "FillUp - Gas Mileage Log Android App (Flutter)"
publish_to: 'none'
version: 2.1.8+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # Database
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  
  # Internationalization
  intl: any
  
  # Charts
  fl_chart: ^0.70.0

  # SVG rendering
  flutter_svg: ^2.0.16
  
  # File System
  path_provider: ^2.1.6
  
  # Share
  share_plus: ^13.3.0
  
  # Permissions
  permission_handler: ^13.0.1
  
  # Preferences
  shared_preferences: ^2.3.0
  
  # Package Info
  package_info_plus: ^10.2.1
  
  # WebView
  webview_flutter: ^4.10.0
  
  # File Picker
  file_picker: ^12.1.2
  
  # Icons
  cupertino_icons: ^1.0.8

  # Units Conversion
  units_converter: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/brands_icons/core/optimized/
